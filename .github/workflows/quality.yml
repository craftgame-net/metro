name: Quality

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rules:
    name: Check rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check rules
        run: .github/scripts/check-rules.sh

  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build and lint
        run: ./gradlew build detektMain detektTest --no-daemon

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
