version: 1
lines:
  red:
    display: '123'
    icon: REDSTONE_BLOCK
    stations:
    - 'true'
    - '7'
    - numid
    - alias
    - central
    - 'off'
    - faraway
    speed: 0.7
  dotted:
    display: dotted
    icon: COMPASS
    stations: []
  nolist:
    display: No List
    icon: COMPASS
    stations: []
stations:
  'true':
    display: 'true'
    world: world
    icon: COMPASS
    terminal: true
    platforms:
    - id: '0'
      icon: OAK_SIGN
      board:
      - 9.0
      - 64.0
      - 9.0
  numid:
    display: Num Id
    world: world
    icon: COMPASS
    platforms:
    - id: '1'
      icon: OAK_SIGN
      board:
      - 1.0
      - 64.0
      - 1.0
      begin:
      - 1.5
      - 64.0625
      - 2.5
      out:
      - 1.5
      - 64.0625
      - 4.5
      heading: EAST
    - id: '0'
      display: Second
      icon: OAK_SIGN
      in:
      - 2.5
      - 64.0
      - 4.5
      eject:
      - 2.5
      - 64.0
      - 2.5
      land:
      - 3.0
      - 64.0
      - 2.0
    - id: 'yes'
      icon: OAK_DOOR
      heading: NORTH
    - id: '5'
      icon: OAK_DOOR
    - id: '6'
      icon: OAK_DOOR
  alias:
    display: Num Id
    world: world
    icon: COMPASS
    platforms:
    - id: '5'
      icon: OAK_DOOR
  '7':
    display: '7'
    world: world
    icon: COMPASS
    platforms: []
  central:
    display: Central
    world: world
    icon: STONE
