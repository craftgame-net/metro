    platforms:
    - id: '0'
      display: North
      icon: OAK_DOOR
      board:
      - 1.0
      - 64.0625
      - 0.0
      begin:
      - 2.0
      - 64.0625
      - 0.0
      out:
      - 3.0
      - 64.0625
      - 0.0
      in:
      - 4.0
      - 64.0625
      - 0.0
      eject:
      - 5.0
      - 64.0625
      - 0.0
      land:
      - 6.0
      - 64.0625
      - 0.0
