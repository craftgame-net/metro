  '123':
    display: '~'
    world: world
    icon: OAK_SIGN
    platforms: []
  'no':
    display: a very long display name that goes well past the eighty column width
      of the yaml dumper, to see folding
    world: world
    icon: COMPASS
    platforms: []
junctions:
  j:
    world: world
    x: 9.0
    y: 64.0625
    z: 9.0
    kind: cross
    turns: false
    speed: 0.4
  'off':
    world: world
    x: 19.0
    y: 64.0625
    z: 9.0
    kind: split
  '2':
    world: world
    x: 29.0
    y: 64.0625
    z: 9.0
    kind: join
    speed: 1.5
edges:
  e:
    from-node: central:0:out
    to-node: junction.j.x
    cruise-speed: 0.7
    auto: false
    points:
    - - 3.0
      - 64.0625
      - 0.0
    - - 3.0
      - 64.0625
      - 9.0
    - - 9.0
      - 64.0625
      - 9.0
    switches:
    - 0
    - 2
    start-switch-speed: 0.3
    end-switch-speed: 0.25
  central_east_out->on_0_in:
    from-node: central:east:out
    to-node: on:0:in
    points:
    - - 1.0
      - 64.0625
      - 0.0
    switches: []
  x:
    from-node: junction.off.z
    to-node: junction.2.x
    cruise-speed: 0.05
    points: []
    end-switch-speed: 1.5
